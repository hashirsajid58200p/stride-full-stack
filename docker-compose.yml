version: '3.8'

services:
  # ----------------------------------------------------
  # 1. Redis In-Memory Cache
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stride-net

  # ----------------------------------------------------
  # 2. Node.js & Express API Backend
  # ----------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stride-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stride-net

  # ----------------------------------------------------
  # 3. React Vite SPA Frontend (Nginx)
  # ----------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stride-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - stride-net

volumes:
  redis_data:
    driver: local

networks:
  stride-net:
    driver: bridge
