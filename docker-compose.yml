services:
  # ----------------------------------------------------
  # 1. In-Memory Cache (Redis 7)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - stride-net

  # ----------------------------------------------------
  # 2. Node.js & Express API Backend
  # ----------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stride-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5000,http://127.0.0.1,http://16.170.250.11,https://stride-full-stack.vercel.app
    env_file:
      - path: ./server/.env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stride-net

  # ----------------------------------------------------
  # 3. React SPA Frontend (Nginx)
  # ----------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stride-client
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      server:
        condition: service_healthy
    networks:
      - stride-net

volumes:
  redis_data:
    driver: local

networks:
  stride-net:
    driver: bridge
