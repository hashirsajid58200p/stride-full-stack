name: CI Pipeline

on:
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

jobs:
  validate-client:
    name: Lint & Build Client (Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Lint Client Source
        run: cd client && npm run lint || true

      - name: Build Production Client
        run: cd client && npm run build

  validate-server:
    name: Validate Server (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Syntax Check Server Entrypoint
        run: node --check server/server.js

  validate-docker:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: [validate-client, validate-server]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: stride-client:test

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: stride-server:test
